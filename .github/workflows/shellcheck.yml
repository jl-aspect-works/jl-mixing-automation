# Enforce warning-level shell portability and safety checks.
name: ShellCheck

# Run alongside functional tests for pushes and pull requests.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    name: Documentation and change scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        name: Check changed files and documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/check-change-scope.py "$BASE_SHA" "$HEAD_SHA"

  # Ubuntu provides a predictable ShellCheck package for static analysis.
  shellcheck:
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      # Analyze the exact commit under review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: tools/shellcheck-all

  required:
    name: Required ShellCheck
    if: always()
    needs: [scope, shellcheck]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm ShellCheck passed when required
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL_CI: ${{ needs.scope.outputs.full_ci }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$FULL_CI" = true ]; then
            test "$SHELLCHECK_RESULT" = success
          else
            test "$FULL_CI" = false
          fi
