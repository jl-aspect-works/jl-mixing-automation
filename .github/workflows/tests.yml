# Verify behavior on both target operating-system families.
name: Tests

# Run for every proposed or direct repository change.
on:
  push:
  pull_request:

jobs:
  batch4:
    # Preserve the v1.4 POSIX regression suite during the staged Python port.
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install jq on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install jq on macOS when needed
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null 2>&1 || brew install jq
      - name: Install Python validation dependency
        run: python -m pip install -r packaging/requirements.txt
      - name: Install macOS runtime bundler
        if: runner.os == 'macOS'
        run: python -m pip install -r packaging/macos-build-requirements.txt
      - name: Build self-contained macOS runtime
        if: runner.os == 'macOS'
        run: bash ./macos/build-runtime.sh
      - name: Run bundled macOS runtime smoke tests
        if: runner.os == 'macOS'
        run: bash ./tests/macos/test-runtime-bundle.sh
      - name: Run self-contained macOS installation lifecycle tests
        if: runner.os == 'macOS'
        run: bash ./tests/macos/test-self-contained-installation.sh
      - name: Run strict Batch 4 tests
        env:
          JL_MIXING_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: make strict-test

  windows-python:
    # Exercise the v1.5 authoritative Python runtime, native command glue,
    # self-contained runtime bundle, installer, and release ZIP on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python validation dependency
        run: python -m pip install -r packaging/requirements.txt
      - name: Install Windows runtime bundler
        run: python -m pip install -r packaging/windows-build-requirements.txt
      - name: Run v1.5 Python runtime tests
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: python -m unittest discover -s tests/python -p "test_*.py"
      - name: Run native Windows command surface tests
        shell: pwsh
        run: ./tests/windows/test-command-surface.ps1
      - name: Build self-contained Windows runtime
        shell: pwsh
        run: ./windows/build-runtime.ps1
      - name: Run bundled Windows runtime smoke tests
        shell: pwsh
        run: ./tests/windows/test-runtime-bundle.ps1
      - name: Run Windows installation lifecycle tests
        shell: pwsh
        run: ./tests/windows/test-installation.ps1
      - name: Run Windows release package lifecycle tests
        shell: pwsh
        run: ./tests/windows/test-release-package.ps1
