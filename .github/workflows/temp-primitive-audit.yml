name: Temp primitive audit

on:
  push:
    branches:
      - fix/managed-import-nas-acl

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit production temp and restrictive permission primitives
        shell: bash
        run: |
          set -eu
          echo '=== tempfile module/import/use ==='
          grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.md' --exclude='*.json' '(^|[^A-Za-z_])tempfile([^A-Za-z_]|$)|mkdtemp|mkstemp|TemporaryDirectory|NamedTemporaryFile|TemporaryFile|SpooledTemporaryFile' src lib tools bin windows macos install.sh uninstall.sh 2>/dev/null || true
          echo '=== restrictive mkdir/chmod/mode patterns ==='
          grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.md' --exclude='*.json' 'chmod\([^\n]*(0o700|0o600)|chmod[[:space:]]+(600|700)|mode[[:space:]]*=[[:space:]]*(0o700|0o600)|mkdir[^\n]*(0o700|0o600)' src lib tools bin windows macos install.sh uninstall.sh 2>/dev/null || true
          echo '=== shell temp directory/file primitives ==='
          grep -RInE --exclude-dir=.git --exclude-dir=tests --exclude='*.md' --exclude='*.json' 'mktemp|TMPDIR|TEMP=|TMP=' src lib tools bin windows macos install.sh uninstall.sh 2>/dev/null || true
