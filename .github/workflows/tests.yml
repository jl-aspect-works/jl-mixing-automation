# Verify behavior on both target operating-system families.
name: Tests

# Run for every proposed or direct repository change; skip platform jobs for documentation-only changes.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    name: Documentation and change scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test change-scope classifier
        run: python3 .github/scripts/test_change_scope.py
      - name: Test immutable release guard
        run: python3 .github/scripts/test_release_guard.py
      - id: classify
        name: Check changed files and documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/check-change-scope.py "$BASE_SHA" "$HEAD_SHA"

  batch4:
    # Preserve the v1.4 POSIX regression suite during the staged Python port.
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install jq on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install jq on macOS when needed
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null 2>&1 || brew install jq
      - name: Install Python validation dependency
        run: python -m pip install -r packaging/requirements.txt
      - name: Install macOS runtime bundler
        if: runner.os == 'macOS'
        run: python -m pip install -r packaging/macos-build-requirements.txt
      - name: Build self-contained macOS runtime
        if: runner.os == 'macOS'
        run: bash ./macos/build-runtime.sh
      - name: Run bundled macOS runtime smoke tests
        if: runner.os == 'macOS'
        run: bash ./tests/macos/test-runtime-bundle.sh
      - name: Run self-contained macOS installation lifecycle tests
        if: runner.os == 'macOS'
        run: bash ./tests/macos/test-self-contained-installation.sh
      - name: Run strict Batch 4 tests
        env:
          JL_MIXING_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: make strict-test

  windows-python:
    # Exercise the v1.5 authoritative Python runtime, native command glue,
    # self-contained runtime bundle, installer, and release ZIP on Windows.
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python validation dependency
        run: python -m pip install -r packaging/requirements.txt
      - name: Install Windows runtime bundler
        run: python -m pip install -r packaging/windows-build-requirements.txt
      - name: Run v1.5 Python runtime tests
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: python -m unittest discover -s tests/python -p "test_*.py"
      - name: Run native Windows command surface tests
        shell: pwsh
        run: ./tests/windows/test-command-surface.ps1
      - name: Build self-contained Windows runtime
        shell: pwsh
        run: ./windows/build-runtime.ps1
      - name: Run bundled Windows runtime smoke tests
        shell: pwsh
        run: ./tests/windows/test-runtime-bundle.ps1
      - name: Run Windows installation lifecycle tests
        shell: pwsh
        run: ./tests/windows/test-installation.ps1
      - name: Run Windows release package lifecycle tests
        shell: pwsh
        run: ./tests/windows/test-release-package.ps1

  artifact-transfer:
    name: Artifact transfer smoke test
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create representative platform assets and checksums
        run: |
          set -euo pipefail
          for platform in linux macos-intel macos-arm64 windows; do
            mkdir -p "fixture/$platform"
            printf 'artifact transfer fixture: %s\n' "$platform" > "fixture/$platform/package-$platform.txt"
            (
              cd "fixture/$platform"
              sha256sum "package-$platform.txt" > "package-$platform.sha256"
            )
            printf 'package-%s.txt\n' "$platform" > "fixture/$platform/package-$platform.inventory.txt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transfer-smoke-linux
          path: fixture/linux/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transfer-smoke-macos-intel
          path: fixture/macos-intel/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transfer-smoke-macos-arm64
          path: fixture/macos-arm64/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transfer-smoke-windows
          path: fixture/windows/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: transfer-smoke-*
          path: downloaded
          merge-multiple: true
      - name: Verify merged assets, checksums, and inventories
        run: |
          set -euo pipefail
          test "$(find downloaded -type f | wc -l)" -eq 12
          cd downloaded
          for platform in linux macos-intel macos-arm64 windows; do
            sha256sum --check "package-$platform.sha256"
            test "$(cat "package-$platform.inventory.txt")" = "package-$platform.txt"
            test "$(cat "package-$platform.txt")" = "artifact transfer fixture: $platform"
          done

  required:
    name: Required tests
    if: always()
    needs: [scope, batch4, windows-python, artifact-transfer]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the tests required for this change passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL_CI: ${{ needs.scope.outputs.full_ci }}
          BATCH_RESULT: ${{ needs.batch4.result }}
          WINDOWS_RESULT: ${{ needs.windows-python.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-transfer.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$FULL_CI" = true ]; then
            test "$BATCH_RESULT" = success
            test "$WINDOWS_RESULT" = success
            test "$ARTIFACT_RESULT" = success
          else
            test "$FULL_CI" = false
          fi
