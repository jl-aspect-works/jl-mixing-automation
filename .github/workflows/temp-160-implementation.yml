name: Temporary 160 implementation
on:
  push:
    branches:
      - feature/160-import-progress-validation-triggers
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Implement managed import progress'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/160-import-progress-validation-triggers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply implementation
        run: python scripts/temp_apply_160.py
      - name: Run focused tests
        run: python -m unittest tests.python.test_managed_client_files_api tests.python.test_system_info
      - name: Remove temporary helpers and commit
        run: |
          rm .github/workflows/temp-160-implementation.yml scripts/temp_apply_160.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement managed import progress'
          git push