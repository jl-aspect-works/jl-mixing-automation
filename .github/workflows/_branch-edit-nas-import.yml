name: Branch edit - NAS managed import

on:
  push:
    branches:
      - fix/v2.1-nas-managed-import

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.1-nas-managed-import
      - name: Replace metadata-preserving copies
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/jl_mixing/managed_client_files.py')
          text = path.read_text(encoding='utf-8')
          old = 'shutil.copy2('
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 copy2 calls, found {count}')
          path.write_text(text.replace(old, 'shutil.copyfile('), encoding='utf-8')
          PY
      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/_branch-edit-nas-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jl_mixing/managed_client_files.py .github/workflows/_branch-edit-nas-import.yml
          git commit -m "Use content-only copies for managed import staging"
          git push origin HEAD:fix/v2.1-nas-managed-import
