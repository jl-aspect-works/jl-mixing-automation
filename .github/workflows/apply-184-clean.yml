name: Apply issue 184 clean
on:
  push:
    branches: [perf/184-nas-import-progress-v2]
    paths: [.github/workflows/apply-184-clean.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/184-nas-import-progress-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused edits
        run: python tools/apply_issue_184_temp.py
      - name: Compile and focused tests
        run: |
          python -m compileall -q src/jl_mixing
          python -m pip install -q pytest
          pytest -q tests/python/test_managed_import_progress_contract.py tests/python/test_managed_import_profiling.py tests/python/test_import_provenance_hash_reuse.py tests/python/test_managed_client_files_nas.py
      - name: Commit product changes and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply_issue_184_temp.py .github/workflows/apply-184-clean.yml
          git add src/jl_mixing tests/python/test_managed_import_progress_contract.py
          git commit -m 'Optimize NAS import metadata and progress'
          git push origin HEAD:perf/184-nas-import-progress-v2
# rerun after progress contract test update
