name: Temp staging progress test
on:
  push:
    branches:
      - feature/163-managed-import-staging-progress
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/163-managed-import-staging-progress
      - name: Strengthen managed import progress test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/python/test_managed_client_files_api.py')
          text = path.read_text()
          old = '''            events = [json.loads(line.removeprefix("JL_PROGRESS ")) for line in lines]\n            self.assertTrue(all(event["operation"] == "client.files.import.execute" for event in events))\n            self.assertEqual(events[-1]["phase"], "complete")\n'''
          new = '''            events = [json.loads(line.removeprefix("JL_PROGRESS ")) for line in lines]\n            self.assertTrue(all(event["operation"] == "client.files.import.execute" for event in events))\n            staging_completed = [event["completed"] for event in events if event["phase"] == "staging"]\n            self.assertEqual(staging_completed[0], 0)\n            self.assertEqual(staging_completed[-1], 2)\n            self.assertIn(1, staging_completed)\n            self.assertEqual(events[-1]["phase"], "complete")\n'''
          if old not in text:
              raise SystemExit('progress assertion block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-163-progress-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Test managed import staging progress'
          git push origin HEAD:feature/163-managed-import-staging-progress
