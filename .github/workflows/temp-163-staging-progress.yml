name: Temp staging progress fix
on:
  push:
    branches:
      - feature/163-managed-import-staging-progress
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/163-managed-import-staging-progress
      - name: Apply focused progress change
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/jl_mixing/managed_client_files.py')
          text = path.read_text()
          old = '''    def emit_progress(phase: str, active: list[str]) -> None:\n        if progress is not None:\n            progress({"phase": phase, "completed": completed_files, "total": total_files, "active": active})\n'''
          new = '''    def emit_progress(phase: str, active: list[str], *, completed: int | None = None) -> None:\n        if progress is not None:\n            progress({\n                "phase": phase,\n                "completed": completed_files if completed is None else completed,\n                "total": total_files,\n                "active": active,\n            })\n'''
          if old not in text:
              raise SystemExit('emit_progress block not found')
          text = text.replace(old, new, 1)
          old2 = '''        staged: dict[str, Path] = {}\n        for relative, source in source_objects.items():\n            emit_progress("staging", [relative])\n            staged[relative] = _stage_source(source, stage)\n        emit_progress("importing", [])\n'''
          new2 = '''        staged: dict[str, Path] = {}\n        staged_files = 0\n        for relative, source in source_objects.items():\n            emit_progress("staging", [relative], completed=staged_files)\n            staged[relative] = _stage_source(source, stage)\n            staged_files += 1\n            emit_progress("staging", [], completed=staged_files)\n        emit_progress("importing", [])\n'''
          if old2 not in text:
              raise SystemExit('staging block not found')
          path.write_text(text)
          PY
      - name: Update progress test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/python/test_managed_client_files_api.py')
          text = path.read_text()
          marker = 'def test_import_execute_progress_is_emitted'
          if marker in text and 'staging_completed' not in text:
              # Keep the existing test intact; add assertions only where the current event list is already available.
              text = text.replace(
                  '    assert progress_events[-1]["phase"] == "complete"\n',
                  '    staging_completed = [event["completed"] for event in progress_events if event["phase"] == "staging"]\n    assert staging_completed[0] == 0\n    assert staging_completed[-1] == 1\n    assert progress_events[-1]["phase"] == "complete"\n',
                  1,
              )
              path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-163-staging-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Report managed import staging progress'
          git push origin HEAD:feature/163-managed-import-staging-progress
